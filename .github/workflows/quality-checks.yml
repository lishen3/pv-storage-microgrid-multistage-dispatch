name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/Q4_3动态滚动优化/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r "code/Q4_3动态滚动优化/requirements.txt"

      - name: Compile five entry points
        run: >-
          python -m py_compile
          "code/Q1_确定性优化/main.py"
          "code/Q2_随机规划/main_q2_final_causal_v2.py"
          "code/Q3_滚动优化/main_q3_final_causal_v2.py"
          "code/Q4_2动态电价/main_q4_2_final_causal.py"
          "code/Q4_3动态滚动优化/main_q4_3_final_causal.py"

      - name: Check tracked files for public-release risks
        run: python scripts/check_public_files.py

      - name: Test core constraints with synthetic data
        run: python -m unittest tests/test_synthetic_constraints.py -v
